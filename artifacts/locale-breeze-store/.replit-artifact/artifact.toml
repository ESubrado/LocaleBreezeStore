kind = "web"
previewPath = "/"
title = "Locale Breeze Store"
version = "1.0.0"
id = "artifacts/locale-breeze-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20372

[services.development]
run = "pnpm --filter @workspace/locale-breeze-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/locale-breeze-store", "run", "build" ]
publicDir = "artifacts/locale-breeze-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20372"
BASE_PATH = "/"
