services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/locale_breeze_store

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=locale_breeze_store
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locale_breeze_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
