services:
  web:
    build: .
    ports: 
      - "5005:5000"
      - "5678:5678"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/locale_breeze_store
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m flask run --no-debugger --no-reload --host 0.0.0.0 --port 5000"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=locale_breeze_store
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locale_breeze_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
